[project]
name = "rag-lab"
version = "0.1.0"
description = "Learning Enterprise RAG, step by step, scored on EnterpriseRAG-Bench"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Local embedding models. Heavy: pulls torch.
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.uv]
# Not an installable package yet; just an environment for our scripts.
package = false
