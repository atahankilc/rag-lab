<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // the saved theme, before the first paint (src/state/theme.ts keeps it in sync afterwards)
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("rag-lab.theme");
        } catch (e) {}
        var light = pref === "light" || (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
    <title>RAG Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
